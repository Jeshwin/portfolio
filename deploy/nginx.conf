# /etc/nginx/sites-available/jeshwinprince
#
# One-time setup on the EC2 instance:
#   sudo apt install -y nginx
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/jeshwinprince
#   sudo ln -sf /etc/nginx/sites-available/jeshwinprince /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS, run `sudo certbot --nginx -d jeshwinprince.com -d www.jeshwinprince.com`
# after this config is in place - certbot will rewrite the config.

server {
    listen 80;
    listen [::]:80;
    server_name jeshwinprince.com www.jeshwinprince.com;

    root /var/www/jeshwinprince/dist;
    index index.html;

    # Never let clients cache index.html - it points at the versioned JS/CSS
    # bundles and needs to update every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Everything in /assets/ is content-hashed by Vite (e.g. main.a1b2c3d4.js)
    # so it's safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same treatment for local images - filenames don't change once merged.
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Every route in the SPA is pre-rendered to its own HTML file by
    # vite-react-ssg (e.g. dist/blog/making-my-website/index.html), so
    # try_files will find them. Fall back to /index.html for anything
    # unexpected (client-side navigation on a brand-new route).
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Basic hardening
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
