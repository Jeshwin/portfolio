title: "ENGR 1 Lab"
description: "During my winter quarter of my first year at Santa Clara University, I took the general engineering lab that all engineering students take to learn more about the engineering process in various fields. Every week we would have a new project that would teach us about a new field of engineering and how engineers in these fields solve problems. For one of the weeks, we learn about biomechanics by designing a hand extension out of cardboard, straws, string, and glue. From these simple elements, we were able to create a functional arm that could pick up ping pong balls and even a roll of tape! By using engineering concepts, my lab group and I were able to create something functional despite the material constraints. For the last four weeks of the lab, we had to create our own robot using any of the materials provided by the lab. This project gave us the freedom of making our own goal and designing for it, but also required us to use at least one moving component to incorporate robotics into our final design. My group and I decided to create a small RC car with a cardboard chassis, an Arduino to control the motors and sensors, and a joystick to accept human input. We were able to demo our final design during the lab's final robot show and receive a passing grade."
