title: "August 2022 Blender Challenge"
description: "In August 2022, I participate in a small online competition to create a new summer-related scene in Blender for each week of August. I was able to complete three of the four weeks, and along the way I learned more about 3d rendering, especially in Blender. For two of my three finished scenes, I used Blender's Eevee rendering engine, which prioritizes speed and style over realism. Instead of trying to make something that looked real, I tried to many something unique that was only possible with 3d rendering software. I ended up making a summer drink, a beach chair, and a sandcastle, each using different styles, textures, and rendering methods. From this project, I learned how to think outside the box when designing renders and use computer rendering software in a way that no other medium can."
