name: Deploy portfolio to EC2

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site (Vite + vite-react-ssg)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package dist/
        run: tar -czf deploy.tar.gz -C dist .

      - name: Upload to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp/"

      - name: Deploy on EC2 (atomic swap + nginx reload)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            APP_DIR="/var/www/jeshwinprince"
            RELEASE="$APP_DIR/releases/$(date +%Y%m%d%H%M%S)"

            sudo mkdir -p "$APP_DIR/releases"
            sudo mkdir -p "$RELEASE"
            sudo tar -xzf /tmp/deploy.tar.gz -C "$RELEASE"
            rm /tmp/deploy.tar.gz

            # Atomically swap the `dist` symlink to the new release, so nginx
            # never sees a half-uploaded directory.
            sudo ln -sfn "$RELEASE" "$APP_DIR/dist.new"
            sudo mv -Tf "$APP_DIR/dist.new" "$APP_DIR/dist"

            # Trim old releases, keep the last 5 for quick rollback.
            ls -1dt "$APP_DIR/releases"/*/ | tail -n +6 | xargs -r sudo rm -rf

            # nginx serves $APP_DIR/dist directly, so a reload is enough.
            sudo nginx -t && sudo systemctl reload nginx
