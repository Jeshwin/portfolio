name: Deploy Vite to EC2

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        run: npm run build
        env:
          NODE_ENV: production

      - name: Create deployment package
        run: tar -czf deploy.tar.gz -C dist .

      - name: Upload to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            APP_DIR="/var/www/jeshwinprince"

            # Stop PM2 process if still running from old setup
            pm2 stop jeshwinprince 2>/dev/null || true
            pm2 delete jeshwinprince 2>/dev/null || true

            sudo mkdir -p $APP_DIR
            sudo chown $USER:$USER $APP_DIR
            rm -rf $APP_DIR/*

            cd $APP_DIR
            tar -xzf /tmp/deploy.tar.gz
            rm /tmp/deploy.tar.gz

            # Reload Nginx to serve new static files
            sudo systemctl reload nginx
