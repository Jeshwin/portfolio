name: Deploy Next.js to EC2

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (standalone)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Create deployment package
        run: |
          mkdir -p deploy/.next/static deploy/public
          cp -r .next/standalone/* deploy/
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public
          tar -czf deploy.tar.gz -C deploy .

      - name: Upload to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            export PATH="$PATH:/usr/local/bin"
            [ -f ~/.nvm/nvm.sh ] && source ~/.nvm/nvm.sh

            APP_DIR="/var/www/jeshwinprince"
            ENV_FILE="/var/www/config/jeshwinprince/.env.production"

            pm2 stop jeshwinprince || true

            sudo mkdir -p $APP_DIR
            sudo chown $USER:$USER $APP_DIR
            rm -rf $APP_DIR/*

            cd $APP_DIR
            tar -xzf /tmp/deploy.tar.gz
            rm /tmp/deploy.tar.gz

            ln -sf "$ENV_FILE" "$APP_DIR/.env.production"

            # Standalone uses server.js, not npm start
            pm2 start server.js --name "jeshwinprince"
            pm2 save
