<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Bevy fetches "assets/..." relative to the page, so pin the base
             for /play/sudoku (no trailing slash) too. -->
        <base href="/play/sudoku/" />
        <title>Sudoku | Jeshwin Prince</title>
        <meta name="description" content="A Sudoku game written in Rust with Bevy, compiled to WebAssembly." />
        <link rel="canonical" href="https://jeshwinprince.com/play/sudoku/" />
        <link rel="icon" href="/favicon.ico" />
        <style>
            body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 1.5rem; box-sizing: border-box; background: #1e1e2e; color: #cdd6f4; font-family: system-ui, sans-serif; }
            a { color: #89b4fa; }
            canvas { max-width: 100%; border-radius: 0.75rem; }
            #status { color: #a6adc8; }
        </style>
    </head>
    <body>
        <nav><a href="/projects/sudoku">&larr; Back to the project</a></nav>
        <h1>Sudoku</h1>
        <p id="status">Loading the game (about 20&nbsp;MB)...</p>
        <canvas id="bevy" oncontextmenu="return false;"></canvas>
        <script type="module">
            import init from "./pkg/demo.js";
            const status = document.getElementById("status");
            try {
                const wasm = await init();
                status.remove();
                wasm.start();
            } catch (err) {
                // Bevy exits its loop by throwing; only report failures before start().
                if (document.body.contains(status)) status.textContent = "The game failed to load: " + err;
                else throw err;
            }
        </script>
    </body>
</html>
